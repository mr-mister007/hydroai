[project]
name = "hydroai"
version = "0.1.0"
description = "Estimate AI tool water consumption from network traffic"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hydroai*"]

[project.scripts]
hydroai = "hydroai.__main__:main"
